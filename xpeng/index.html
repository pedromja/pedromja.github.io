const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openDoc(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:P.i,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.v)},k,u(P.c)));
  document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{e.preventDefault();go.disabled=true;go.textContent='A abrir…';err.textContent='';
  const pw=document.getElementById('pw').value;
  try{await openDoc(pw);if(document.getElementById('rem')===null){try{if(window.__rem)localStorage.setItem('dt_pw',pw)}catch(_){}}}
  catch(_){err.textContent='Palavra-passe errada. Confirma maiúsculas e hífenes.';go.disabled=false;go.textContent='Abrir';}
});
document.getElementById('rem').addEventListener('change',e=>{window.__rem=e.target.checked});
try{const s=localStorage.getItem('dt_pw');if(s)openDoc(s).catch(()=>{try{localStorage.removeItem('dt_pw')}catch(_){}})}catch(_){}
</script></body></html>
